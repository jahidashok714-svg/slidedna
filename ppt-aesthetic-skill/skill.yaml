  rationale: The Yubai template task succeeded only after two recipient-readiness corrections the generic documents skill does not cover for editable templates. The user showed that placeholder guidance would not disappear when the recipient pasted material in (message:321bddc9-b912-47a0-99d7-e8ddf7802412), and the repair moved 31 guidance items across 13 pages into speaker notes and redrew 4 native tables as shapes so previews could not drop them (assistant-msg-394ea4ae-3984-41fd-9470-8b7e374c04f3). The user then showed first characters obscured on pages 11 and 12 in their preview (message:f4884479-45d6-4b60-a73e-b4cb007ed51c), traced to a highlight bar placed too tight against text, while WPS showed the text correctly (message:74d3fcb2-e793-4d81-a8b0-3ad5df24157d), so cross-renderer spacing and overlap checks are part of the method. The same task proved the reference method for editable templates, extracting rules from Slidesgo and SciFig as design study only, with zero copied media and licence limits respected (assistant-msg-22c3290e-92d7-4cee-b397-8ee18377fb16), and produced a deck praised as extremely professional (message:132251b9-5acb-4c96-b8ff-f69eadc47596). This revision scopes every reference, shape table, native chart and speaker-notes guidance rule to editable template files outside the Muse artifact workflow, and states that the artifact workflow keeps the StylePlan as sole styling authority with image based charts and an image based PPTX export, as workflow.md and GUIDE.md require. It also removes the Google Slides, Google Drive and Canva connector links, because none of those connector docs lists this skill in Related skills, leaving only the closing discovery bullets. The three existing learned skills are inside their measurement windows and are not re-proposed, and with only three learned skills no consolidation applies.
